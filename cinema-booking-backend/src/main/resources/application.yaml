server:
  port: ${PORT:8080}
  servlet:
    context-path: /api  # Tiền tố cho tất cả API (ví dụ: /api/movies)

spring:
  application:
    name: movie-booking

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Cấu hình Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update      # Tự động tạo/cập nhật bảng từ Java Entity
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true    # Định dạng SQL cho dễ đọc
        highlight_sql: true # Tô màu cú pháp SQL trong console (Tính năng mới)

  # Giới hạn kích thước file upload (Poster phim, ảnh user)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      include-message: always

# Cấu hình Logging để theo dõi luồng dữ liệu
logging:
  level:
    root: INFO
    com.cinema: ${APP_LOG_LEVEL:INFO}
    org.hibernate.orm.results: INFO

# Cấu hình Swagger / SpringDoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html   # Đường dẫn tắt, sẽ redirect đến index.html
  api-docs:
    path: /v3/api-docs
